AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Data Hub per-environment stack: S3 buckets, Lambda function with S3 triggers,
  and IAM roles for Lambda execution and GitHub Actions deployment.

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - staging
      - production

  EcrImageUri:
    Type: String
    Description: Full ECR image URI including tag (e.g., 123456789.dkr.ecr.us-west-1.amazonaws.com/data-hub-staging:staging-abc123)

  GitHubOrg:
    Type: String
    Default: Arcadia-Science

  GitHubRepo:
    Type: String
    Default: data-hub

  DataHubApiUrl:
    Type: String
    Description: Base URL of the Data Hub web API

  DataHubApiKey:
    Type: String
    NoEcho: true
    Description: API key for Lambda to authenticate with the Data Hub API

  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the GitHub Actions OIDC provider (from bootstrap stack)

  VercelOidcProviderArn:
    Type: String
    Description: ARN of the Vercel OIDC provider (from bootstrap stack)

  AdminDeployPrincipalArn:
    Type: String
    Description: >-
      IAM role ARN pattern (wildcards allowed) of the principal that runs admin
      deploys, exempted from the bucket-configuration deny. Use the role ARN
      form (arn:aws:iam::<acct>:role/...), not the sts::assumed-role session
      form — aws:PrincipalArn never returns the session form.

  EnableS3Files:
    Type: String
    AllowedValues:
      - "true"
      - "false"
    Default: "false"
    Description: >-
      Put the Lambda in a VPC with a NAT gateway so it can mount the raw
      bucket. Defaults to false so a self-hosted stack does not pay for a
      NAT gateway. An empty value is rejected, so a deploy that forgets the
      parameter cannot turn an existing network off.

  AlarmEmail:
    Type: String
    Default: ""
    Description: >-
      Optional address for processing alarms. Empty means no email
      subscription. A new subscription stays pending until the address
      confirms it.

Globals:
  Function:
    # Sized for 3-4 GB Hina microscope ND2s: RAM holds the decoded image and
    # 900 s covers download plus processing. /tmp is set per function below.
    Timeout: 900
    MemorySize: 10240

Conditions:
  # Preview deployments may only ever touch staging. A preview is just a
  # branch push, so trusting preview subjects on the production role would
  # bypass production branch protection.
  AllowPreviewSubject: !Equals [!Ref Environment, staging]
  IsStaging: !Equals [!Ref Environment, staging]
  S3FilesEnabled: !Equals [!Ref EnableS3Files, "true"]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  # ---- S3 buckets ----

  RawDataBucket:
    Type: AWS::S3::Bucket
    DependsOn: S3InvokeLambdaPermission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "arcadia-data-hub-raw-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      # Block Public Access follows the S3 account default: the CI deploy role
      # can't call `s3:PutBucketPublicAccessBlock`, so pinning it breaks deploys.

      # Browsers fetch CSVs here from a sandbox origin the MCP host picks, so
      # it has to be `*`. Objects stay private behind presigned URLs.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
              - Content-Length
            MaxAge: 3600
      NotificationConfiguration:
        # Catch-all: the handler resolves instrument_type itself. Deploy the
        # type-dispatch handler first or an older one processes every event.
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt DataHubFunction.Arn
        # S3 replaces the whole notification configuration on every write.
        # Declaring EventBridge here keeps a later deploy from turning off
        # the delivery S3 Files uses to learn about new objects.
        EventBridgeConfiguration: !If
          - S3FilesEnabled
          - EventBridgeEnabled: true
          - !Ref AWS::NoValue
      # S3 bills for parts until the upload is completed or cancelled. Seven
      # days covers a watcher that stops mid-file. This is the bucket's only
      # lifecycle rule; a deploy replaces the whole configuration.
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: project
          Value: arcadia-data-hub

  ProcessedDataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "arcadia-data-hub-processed-${Environment}"
      VersioningConfiguration:
        Status: Enabled
      # See RawDataBucket for the Block Public Access and CORS rationale. This
      # bucket holds processed artifacts, most of what the run report renders.
      CorsConfiguration:
        CorsRules:
          - AllowedMethods:
              - GET
              - HEAD
            AllowedOrigins:
              - "*"
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
              - Content-Length
            MaxAge: 3600
      Tags:
        - Key: project
          Value: arcadia-data-hub

  # Cache for run-archive zips built by the Lambda. Objects expire after a week
  # and rebuild on demand; browsers are redirected to S3, never through Vercel.
  ArchivesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "arcadia-data-hub-archives-${Environment}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBuiltArchives
            Status: Enabled
            ExpirationInDays: 7
          - Id: AbortStaleMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: project
          Value: arcadia-data-hub

  # ---- S3 bucket policies: deny object writes from unapproved principals ----
  # The account grants everyone full S3 access, so only an explicit Deny stops
  # writes. Each bucket exempts its writer. Bucket-configuration changes are
  # denied to everyone except the admin deploy principal and root.

  RawDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyObjectWritesExceptWebApp
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:RestoreObject
              - s3:AbortMultipartUpload
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt WebAppS3Role.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                  # The S3 Files sync role. S3 Files will not create the file system
                  # while this denies it, and this policy updates only after the file
                  # system, so the exemption is unconditional and must already be live.
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/data-hub-s3files-${Environment}"
          # Config changes stay admin-only so CI can never disable the write
          # protection above. Root can always repair the policy (S3 guarantee).
          - Sid: DenyBucketConfigExceptAdmin
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketAcl
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketVersioning
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                  - !Ref AdminDeployPrincipalArn

  ProcessedDataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ProcessedDataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyObjectWritesExceptLambda
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:RestoreObject
              - s3:AbortMultipartUpload
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt LambdaExecutionRole.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
          - Sid: DenyBucketConfigExceptAdmin
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketAcl
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketVersioning
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                  - !Ref AdminDeployPrincipalArn

  ArchivesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchivesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyObjectWritesExceptLambda
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutObject
              - s3:PutObjectAcl
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:RestoreObject
              - s3:AbortMultipartUpload
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}/*"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !GetAtt LambdaExecutionRole.Arn
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
          - Sid: DenyBucketConfigExceptAdmin
            Effect: Deny
            Principal: "*"
            Action:
              - s3:PutBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketAcl
              - s3:PutBucketPublicAccessBlock
              - s3:PutBucketVersioning
            Resource: !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}"
            Condition:
              ArnNotLike:
                aws:PrincipalArn:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:root"
                  - !Ref AdminDeployPrincipalArn

  # ---- Network for the raw-bucket mount ----
  # The Lambda calls the Data Hub API on the public internet, so a private
  # subnet needs a NAT gateway. The S3 gateway endpoint keeps bucket traffic
  # off that gateway. Staging and production use different address ranges so
  # the two networks could be peered later without renumbering.

  DataHubVpc:
    Type: AWS::EC2::VPC
    Condition: S3FilesEnabled
    Properties:
      CidrBlock: !If [IsStaging, "10.20.0.0/16", "10.21.0.0/16"]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}"
        - Key: project
          Value: arcadia-data-hub

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !If [IsStaging, "10.20.0.0/24", "10.21.0.0/24"]
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-public"

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !If [IsStaging, "10.20.1.0/24", "10.21.1.0/24"]
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-private-a"

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !If [IsStaging, "10.20.2.0/24", "10.21.2.0/24"]
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-private-b"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: S3FilesEnabled
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}"

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      InternetGatewayId: !Ref InternetGateway

  NatEip:
    Type: AWS::EC2::EIP
    Condition: S3FilesEnabled
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-nat"

  # One gateway serves both private subnets. If its zone has an outage, the
  # Lambda loses API access until it recovers; a second gateway doubles the cost.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: S3FilesEnabled
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-public"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: S3FilesEnabled
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: S3FilesEnabled
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-private"

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: S3FilesEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: S3FilesEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: S3FilesEnabled
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Gateway endpoints are free. Without this route, archive builds would
  # pay NAT data charges for every byte read from S3.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: S3FilesEnabled
    Properties:
      VpcId: !Ref DataHubVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # NFS names the VPC range, not the mount-target group, so all egress stays
  # inline without a reference cycle. Mixing inline and standalone egress on
  # one group can drop rules on update. Amazon DNS is never filtered.
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: S3FilesEnabled
    Properties:
      GroupDescription: !Sub "data-hub-${Environment} Lambda"
      VpcId: !Ref DataHubVpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to the Data Hub API and AWS APIs
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          CidrIp: !GetAtt DataHubVpc.CidrBlock
          Description: NFS to the raw-bucket mount targets
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-lambda"

  # ---- Read-only mount of the raw bucket ----
  # Nothing can write through the mount: the file system policy denies writes
  # and root access, and no client role has `s3files:ClientWrite`, so the sync
  # role never has a change to copy back to the bucket.

  S3FilesSyncRole:
    Type: AWS::IAM::Role
    Condition: S3FilesEnabled
    Properties:
      RoleName: !Sub "data-hub-s3files-${Environment}"
      PermissionsBoundary: !If
        - IsStaging
        - !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-staging"
        - !Ref AWS::NoValue
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowS3FilesAssumeRole
            Effect: Allow
            Principal:
              Service: elasticfilesystem.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:s3files:${AWS::Region}:${AWS::AccountId}:file-system/*"
      Policies:
        - PolicyName: SyncRawBucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListRawBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              # The set AWS documents for the sync role. S3 Files checks all of it
              # when it creates the file system, and a read-only set fails with
              # "does not have permission to call s3:HeadObject".
              - Sid: SyncRawObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject*
                  - s3:GetObject*
                  - s3:List*
                  - s3:PutObject*
                Resource: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              # No KMS statement: the raw bucket uses SSE-S3, which makes no KMS
              # calls. Moving it to SSE-KMS needs one here and in the boundary.
              - Sid: EventBridgeManage
                Effect: Allow
                Action:
                  - events:DeleteRule
                  - events:DisableRule
                  - events:EnableRule
                  - events:PutRule
                  - events:PutTargets
                  - events:RemoveTargets
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-S3-Files*"
                Condition:
                  StringEquals:
                    events:ManagedBy: elasticfilesystem.amazonaws.com
              - Sid: EventBridgeRead
                Effect: Allow
                Action:
                  - events:DescribeRule
                  - events:ListRuleNamesByTarget
                  - events:ListRules
                  - events:ListTargetsByRule
                Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*"

  RawFilesFileSystem:
    Type: AWS::S3Files::FileSystem
    Condition: S3FilesEnabled
    Properties:
      # A GetAtt on the bucket would loop: the function waits for the mount
      # targets, which wait for this file system, which would wait for the
      # bucket, which waits for the invoke permission, which waits for the
      # function. The bucket name is fixed by this template.
      Bucket: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
      RoleArn: !GetAtt S3FilesSyncRole.Arn
      SynchronizationConfiguration:
        ImportDataRules:
          - Prefix: ""
            SizeLessThan: 0
            Trigger: ON_FILE_ACCESS
        ExpirationDataRules:
          - DaysAfterLastAccess: 1
      Tags:
        - Key: project
          Value: arcadia-data-hub
        - Key: environment
          Value: !Ref Environment

  MountTargetSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: S3FilesEnabled
    Properties:
      GroupDescription: !Sub "data-hub-${Environment} S3 Files mount targets"
      VpcId: !Ref DataHubVpc
      Tags:
        - Key: Name
          Value: !Sub "data-hub-${Environment}-s3files"

  MountTargetNfsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: S3FilesEnabled
    Properties:
      GroupId: !Ref MountTargetSecurityGroup
      IpProtocol: tcp
      FromPort: 2049
      ToPort: 2049
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: NFS from the Lambda

  RawFilesMountTargetA:
    Type: AWS::S3Files::MountTarget
    Condition: S3FilesEnabled
    Properties:
      FileSystemId: !GetAtt RawFilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups:
        - !Ref MountTargetSecurityGroup

  RawFilesMountTargetB:
    Type: AWS::S3Files::MountTarget
    Condition: S3FilesEnabled
    Properties:
      FileSystemId: !GetAtt RawFilesFileSystem.FileSystemId
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups:
        - !Ref MountTargetSecurityGroup

  RawFilesAccessPoint:
    Type: AWS::S3Files::AccessPoint
    Condition: S3FilesEnabled
    Properties:
      FileSystemId: !GetAtt RawFilesFileSystem.FileSystemId
      PosixUser:
        Uid: "1000"
        Gid: "1000"
      RootDirectory:
        Path: "/"

  # An allow in either an identity policy or this policy is enough to mount,
  # and this account grants broad access, so the limits are explicit denies.
  # The policy cannot deny changes to itself. S3 Files write actions stay
  # out of the deploy role and the staging boundary, so changing it is an
  # admin deploy.
  RawFilesFileSystemPolicy:
    Type: AWS::S3Files::FileSystemPolicy
    Condition: S3FilesEnabled
    Properties:
      FileSystemId: !GetAtt RawFilesFileSystem.FileSystemId
      Policy:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyWriteAndRoot
            Effect: Deny
            Principal: "*"
            Action:
              - s3files:ClientWrite
              - s3files:ClientRootAccess
            Resource: !GetAtt RawFilesFileSystem.FileSystemArn
          - Sid: DenyMountExceptLambdaRole
            Effect: Deny
            Principal: "*"
            Action: s3files:ClientMount
            Resource: !GetAtt RawFilesFileSystem.FileSystemArn
            Condition:
              StringNotEquals:
                aws:PrincipalArn: !GetAtt LambdaExecutionRole.Arn
          - Sid: DenyMountWithoutAccessPoint
            Effect: Deny
            Principal: "*"
            Action: s3files:ClientMount
            Resource: !GetAtt RawFilesFileSystem.FileSystemArn
            Condition:
              "Null":
                s3files:AccessPointArn: "true"
          - Sid: DenyMountExceptOurAccessPoint
            Effect: Deny
            Principal: "*"
            Action: s3files:ClientMount
            Resource: !GetAtt RawFilesFileSystem.FileSystemArn
            Condition:
              StringNotEquals:
                s3files:AccessPointArn: !GetAtt RawFilesAccessPoint.AccessPointArn
          - Sid: AllowLambdaMount
            Effect: Allow
            Principal:
              AWS: !GetAtt LambdaExecutionRole.Arn
            Action: s3files:ClientMount
            Resource: !GetAtt RawFilesFileSystem.FileSystemArn
            Condition:
              StringEquals:
                s3files:AccessPointArn: !GetAtt RawFilesAccessPoint.AccessPointArn

  # ---- Lambda function ----

  DataHubFunction:
    Type: AWS::Serverless::Function
    # These references make the staging boundary and the mount targets finish
    # before the function joins the VPC. DependsOn cannot name a resource whose
    # condition is false. SAM copies Metadata onto the generated function.
    Metadata:
      StagingBoundary: !If [IsStaging, !Ref StagingBoundary, !Ref AWS::NoValue]
      S3FilesMountTargets: !If
        - S3FilesEnabled
        - - !Ref RawFilesMountTargetA
          - !Ref RawFilesMountTargetB
        - !Ref AWS::NoValue
    Properties:
      FunctionName: !Sub "data-hub-${Environment}"
      PackageType: Image
      ImageUri: !Ref EcrImageUri
      EphemeralStorage:
        # 10 GB (the Lambda max) — large Hina ND2 uploads need room for the
        # raw download, the decoded working copy, and the generated JPG.
        Size: 10240
      Role: !GetAtt LambdaExecutionRole.Arn
      FileSystemConfigs: !If
        - S3FilesEnabled
        - - Arn: !GetAtt RawFilesAccessPoint.AccessPointArn
            LocalMountPath: /mnt/raw
        - !Ref AWS::NoValue
      VpcConfig: !If
        - S3FilesEnabled
        - SecurityGroupIds:
            - !Ref LambdaSecurityGroup
          SubnetIds:
            - !Ref PrivateSubnetA
            - !Ref PrivateSubnetB
        - !Ref AWS::NoValue
      FunctionUrlConfig:
        # Callers must SigV4-sign with credentials holding
        # lambda:InvokeFunctionUrl on this function ARN.
        AuthType: AWS_IAM
      Environment:
        Variables:
          AWS_S3_RAW_DATA_BUCKET: !Sub "arcadia-data-hub-raw-${Environment}"
          AWS_S3_PROCESSED_DATA_BUCKET: !Sub "arcadia-data-hub-processed-${Environment}"
          AWS_S3_ARCHIVES_BUCKET: !Sub "arcadia-data-hub-archives-${Environment}"
          DATA_HUB_API_URL: !Ref DataHubApiUrl
          DATA_HUB_API_KEY: !Ref DataHubApiKey
          DATA_HUB_ENVIRONMENT: !Ref Environment
          RAW_DATA_MOUNT_PATH: !If [S3FilesEnabled, "/mnt/raw", ""]

  # ---- S3 → Lambda event wiring ----
  # Wired explicitly rather than with SAM Events, which would make the bucket
  # and the function in this template depend on each other in a loop.

  S3InvokeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref DataHubFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
      SourceAccount: !Ref AWS::AccountId

  # ---- IAM: staging permissions boundary ----
  # Caps what any staging role can ever do, even if its own policies are
  # escalated. The ceiling mirrors the roles' identity policies; anything
  # absent is implicitly denied, so widening the ceiling needs an admin deploy.

  StagingBoundary:
    Type: AWS::IAM::ManagedPolicy
    Condition: IsStaging
    Properties:
      ManagedPolicyName: data-hub-boundary-staging
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Ceiling
            Effect: Allow
            Action:
              - s3:*
              - logs:*
              - lambda:GetFunction
              - lambda:GetFunctionUrlConfig
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:InvokeFunctionUrl
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - cloudformation:CreateChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:DescribeStackEvents
              - cloudformation:DescribeStacks
              - cloudformation:ExecuteChangeSet
              - cloudformation:GetTemplateSummary
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
              - iam:PassRole
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:TagRole
              - iam:UntagRole
              # Constrained by DenyBoundaryRemovalOrSwap below.
              - iam:PutRolePermissionsBoundary
              - sts:GetCallerIdentity
              # The Lambda service creates the VPC network interface with the
              # execution role. The deploy role describes the same network
              # when it updates the function.
              - ec2:CreateNetworkInterface
              - ec2:DescribeNetworkInterfaces
              - ec2:DeleteNetworkInterface
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
              - ec2:GetSecurityGroupsForVpc
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
              # Read and mount only. Write, root, and policy changes stay
              # off this list so a staging role cannot grant them to itself.
              - s3files:ClientMount
              - s3files:GetAccessPoint
              - s3files:GetFileSystem
              - s3files:GetFileSystemPolicy
              - s3files:GetMountTarget
              - s3files:GetSynchronizationConfiguration
              - s3files:ListAccessPoints
              - s3files:ListFileSystems
              - s3files:ListMountTargets
              - s3files:ListTagsForResource
              # Read-only. These do not support `events:ManagedBy`, so they
              # cannot go in CeilingS3FilesRules.
              - events:DescribeRule
              - events:ListRuleNamesByTarget
              - events:ListRules
              - events:ListTargetsByRule
            Resource: "*"
          # S3 Files edits its sync rule as the sync role. Both environments'
          # rules share this prefix, so the principal check keeps other staging
          # roles from granting themselves access to production's rule.
          - Sid: CeilingS3FilesRules
            Effect: Allow
            Action:
              - events:DeleteRule
              - events:DisableRule
              - events:EnableRule
              - events:PutRule
              - events:PutTargets
              - events:RemoveTargets
            Resource: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-S3-Files*"
            Condition:
              StringEquals:
                events:ManagedBy: elasticfilesystem.amazonaws.com
              ArnEquals:
                aws:PrincipalArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/data-hub-s3files-staging"
          # Explicit because an implicit boundary deny does not restrict access
          # granted by a resource-based policy such as a bucket policy.
          - Sid: DenyProductionResources
            Effect: Deny
            Action: "*"
            Resource:
              - "arn:aws:s3:::arcadia-data-hub-*-production"
              - "arn:aws:s3:::arcadia-data-hub-*-production/*"
              - !Sub "arn:aws:iam::${AWS::AccountId}:role/data-hub-*-production"
              # Also blocks lambda:GetFunction on production; its response
              # exposes the function's environment variables (the API key).
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:data-hub-production"
              # Created by the per-environment ECR split; denying a
              # nonexistent ARN is harmless.
              - !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/data-hub-production"
          # StringNotEquals is true when the request carries no
          # iam:PermissionsBoundary key, so this one statement also denies
          # DeleteRolePermissionsBoundary, which never has one.
          - Sid: DenyBoundaryRemovalOrSwap
            Effect: Deny
            Action:
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
            Resource: "*"
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-staging"
          # ForAnyValue is false when a request has no subnets or security groups,
          # so ordinary deploys and leaving the VPC still work. With the VPC off,
          # these deny every subnet and security group, including production's.
          - Sid: DenyLambdaOutsideStagingSubnets
            Effect: Deny
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionConfiguration
            Resource: "*"
            Condition: !If
              - S3FilesEnabled
              - ForAnyValue:StringNotEquals:
                  lambda:SubnetIds:
                    - !Ref PrivateSubnetA
                    - !Ref PrivateSubnetB
              - ForAnyValue:StringLike:
                  lambda:SubnetIds: "*"
          - Sid: DenyLambdaOutsideStagingSecurityGroups
            Effect: Deny
            Action:
              - lambda:CreateFunction
              - lambda:UpdateFunctionConfiguration
            Resource: "*"
            Condition: !If
              - S3FilesEnabled
              - ForAnyValue:StringNotEquals:
                  lambda:SecurityGroupIds:
                    - !Ref LambdaSecurityGroup
              - ForAnyValue:StringLike:
                  lambda:SecurityGroupIds: "*"
          - Sid: DenyProductionS3Files
            Effect: Deny
            Action: s3files:*
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/environment: production

  # ---- IAM: Lambda execution role ----

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "data-hub-lambda-${Environment}"
      PermissionsBoundary: !If [IsStaging, !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-staging", !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Stays attached with the VPC off: Lambda deletes the function's
        # network interface with this role after it leaves the VPC.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}/*"
              # Lambda is the only archives writer. AbortMultipartUpload keeps
              # failed builds from leaking storage.
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                  - s3:ListBucketMultipartUploads
                  - s3:ListMultipartUploadParts
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}/*"
        # Lambda creates the network interface through the managed VPC policy.
        # This deny stops the function's own code from calling those APIs.
        # The ARN is built from the name because GetAtt would loop.
        - PolicyName: DenyEc2ApiFromFunctionCode
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: DenyEc2WhenCalledByThisFunction
                Effect: Deny
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DetachNetworkInterface
                  - ec2:AssignPrivateIpAddresses
                  - ec2:UnassignPrivateIpAddresses
                Resource: "*"
                Condition:
                  ArnEquals:
                    lambda:SourceFunctionArn: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:data-hub-${Environment}"
        - !If
          - S3FilesEnabled
          - PolicyName: RawFilesMount
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Sid: MountRawFiles
                  Effect: Allow
                  Action: s3files:ClientMount
                  Resource: !GetAtt RawFilesFileSystem.FileSystemArn
                  Condition:
                    StringEquals:
                      s3files:AccessPointArn: !GetAtt RawFilesAccessPoint.AccessPointArn
          - !Ref AWS::NoValue

  # ---- IAM: GitHub Actions deploy role ----
  # Routine image updates and in-place bucket config only. New buckets or
  # Lambda functions still need an admin session.

  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "data-hub-deploy-${Environment}"
      PermissionsBoundary: !If [IsStaging, !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-staging", !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  # Environment subject only: a ref-based subject would let any
                  # workflow on the branch assume this role while skipping the
                  # GitHub environment's protection rules.
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${Environment}"
      Policies:
        - PolicyName: EcrPush
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              # Scoped to this environment's repo: ECR IAM can't filter pushes
              # by image tag, so the repository name is the trust boundary.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/data-hub-${Environment}"
        - PolicyName: LambdaUpdate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionUrlConfig
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:data-hub-${Environment}"
        - PolicyName: SamDeploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStacks
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:GetTemplateSummary
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/data-hub-${Environment}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*"
                  - !Sub "arn:aws:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/*"
              # Adding an instrument trigger needs these on the bucket itself,
              # so CI can roll one out without an admin deploy.
              - Effect: Allow
                Action:
                  - s3:GetBucketNotification
                  - s3:PutBucketNotification
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}"
              # Same rationale as notifications above — lets CI roll out CORS
              # changes on the data buckets without an admin deploy.
              - Effect: Allow
                Action:
                  - s3:GetBucketCORS
                  - s3:PutBucketCORS
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}"
              - Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:PassRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:TagRole
                  # CreateRole, AttachRolePolicy, DetachRolePolicy, and DeleteRole
                  # are admin-only: with them, a staging merge could escalate this
                  # role to AdministratorAccess (developer-docs/ci-and-deployment.md).
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/data-hub-*-${Environment}"
              # Lets CloudFormation re-assert the boundary when it updates a role.
              # The condition — and the boundary itself — only ever allow setting
              # this one boundary, never removing or swapping it.
              - Effect: Allow
                Action:
                  - iam:PutRolePermissionsBoundary
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/data-hub-*-${Environment}"
                Condition:
                  StringEquals:
                    iam:PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-${Environment}"
        # Lambda checks these when a deploy attaches the function to the VPC.
        - PolicyName: VpcDescribe
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:GetSecurityGroupsForVpc
                Resource: "*"
        # Listed for attaching a file system in the console. The first CI
        # deploy after the mount exists shows whether an API deploy needs
        # them too. No write actions: changing the file system policy stays
        # an admin deploy.
        - PolicyName: S3FilesRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3files:GetAccessPoint
                  - s3files:GetFileSystem
                  - s3files:ListAccessPoints
                  - s3files:ListFileSystems
                  - s3files:ListMountTargets
                Resource: "*"

  # ---- IAM: Vercel web app role (OIDC federation) ----
  # Lets the Next.js app presign S3 URLs without long-lived AWS credentials.
  # Preview deployments are trusted on staging only — see AllowPreviewSubject.

  WebAppS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "data-hub-webapp-${Environment}"
      PermissionsBoundary: !If [IsStaging, !Sub "arn:aws:iam::${AWS::AccountId}:policy/data-hub-boundary-staging", !Ref "AWS::NoValue"]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref VercelOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "oidc.vercel.com/arcadia-science:aud": "https://vercel.com/arcadia-science"
              StringLike:
                "oidc.vercel.com/arcadia-science:sub":
                  - !Sub "owner:arcadia-science:project:data-hub:environment:${Environment}"
                  - !If
                    - AllowPreviewSubject
                    - "owner:arcadia-science:project:data-hub:environment:preview"
                    - !Ref "AWS::NoValue"
      Policies:
        - PolicyName: S3PresignedUrlAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  # PutObject covers starting, uploading, and finishing a
                  # multipart upload. Cancelling one is a separate action.
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-raw-${Environment}/*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-processed-${Environment}/*"
              # Read-only for the cache check and presigned GETs. ListBucket is
              # required or a missing key 403s instead of the 404 the cache needs.
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}"
                  - !Sub "arn:aws:s3:::arcadia-data-hub-archives-${Environment}/*"
        # Scoped to this stack's function ARN and gated on AuthType=AWS_IAM so
        # it cannot apply if the URL is flipped back to AuthType=NONE.
        - PolicyName: LambdaFunctionUrlInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunctionUrl
                Resource: !GetAtt DataHubFunction.Arn
                Condition:
                  StringEquals:
                    lambda:FunctionUrlAuthType: AWS_IAM

  # ---- Processing alarms ----
  # These stay on even when the VPC is off. A dropped S3 event leaves the
  # file uploaded, and Reprocess accepts that status.

  # Unencrypted: alarms can't publish with the AWS-managed SNS key, and messages hold only alarm names and values.
  ProcessingAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "data-hub-${Environment}-processing-alarms"
      Tags:
        - Key: project
          Value: arcadia-data-hub

  ProcessingAlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref ProcessingAlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarms
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref ProcessingAlarmTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:*"
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  ProcessingAlarmEmail:
    Type: AWS::SNS::Subscription
    Condition: HasAlarmEmail
    Properties:
      Protocol: email
      TopicArn: !Ref ProcessingAlarmTopic
      Endpoint: !Ref AlarmEmail

  AsyncEventsDroppedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-async-events-dropped"
      AlarmDescription: S3 upload events were dropped before the Lambda ran.
      Namespace: AWS/Lambda
      MetricName: AsyncEventsDropped
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataHubFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

  AsyncEventAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-async-event-age"
      AlarmDescription: An S3 event waited more than ten minutes to run. Usually a timed-out run being retried, throttling, or the function recovering from being idle.
      Namespace: AWS/Lambda
      MetricName: AsyncEventAge
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataHubFunction
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 600000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

  FunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-function-errors"
      AlarmDescription: The function returned an error. Invocation failures such as a mount failure may not count here.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DataHubFunction
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

  S3FilesImportFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: S3FilesEnabled
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-s3files-import-failures"
      AlarmDescription: S3 Files could not import objects from the raw bucket.
      Namespace: AWS/S3/Files
      MetricName: ImportFailures
      Dimensions:
        - Name: FileSystemId
          Value: !GetAtt RawFilesFileSystem.FileSystemId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

  S3FilesExportFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: S3FilesEnabled
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-s3files-export-failures"
      AlarmDescription: A write through the raw-bucket mount failed to sync. The mount is supposed to be read-only.
      Namespace: AWS/S3/Files
      MetricName: ExportFailures
      Dimensions:
        - Name: FileSystemId
          Value: !GetAtt RawFilesFileSystem.FileSystemId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

  RawMountWaitTimeoutsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: S3FilesEnabled
    Properties:
      AlarmName: !Sub "data-hub-${Environment}-raw-mount-wait-timeouts"
      AlarmDescription: A raw file did not appear on the mount in time. The file system may have stopped receiving bucket events.
      Namespace: DataHub
      MetricName: RawMountWaitTimeouts
      Dimensions:
        - Name: Environment
          Value: !Ref Environment
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ProcessingAlarmTopic

Outputs:
  DataHubFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DataHubFunction.Arn

  DataHubFunctionName:
    Description: Lambda function name
    Value: !Ref DataHubFunction

  DataHubFunctionUrl:
    Description: Lambda function URL
    Value: !GetAtt DataHubFunctionUrl.FunctionUrl

  RawDataBucketName:
    Description: Raw data S3 bucket name
    Value: !Ref RawDataBucket

  ProcessedDataBucketName:
    Description: Processed data S3 bucket name
    Value: !Ref ProcessedDataBucket

  ArchivesBucketName:
    Description: Archives S3 bucket name (run-zip cache, 7-day expiry)
    Value: !Ref ArchivesBucket

  DeployRoleArn:
    Description: GitHub Actions deploy role ARN
    Value: !GetAtt GitHubActionsDeployRole.Arn

  WebAppRoleArn:
    Description: Vercel web app IAM role ARN (set as AWS_ROLE_ARN in Vercel)
    Value: !GetAtt WebAppS3Role.Arn
