name: Python tests

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/python-test.yml
      - lambda/**
      - packages/**
      - watcher/**
      - pyproject.toml
      - uv.lock
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/python-test.yml
      - lambda/**
      - packages/**
      - watcher/**
      - pyproject.toml
      - uv.lock
      - Makefile

jobs:
  python-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/data_hub_test
      AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      AUTH_GOOGLE_ID: stub
      AUTH_GOOGLE_SECRET: stub

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install Node.js packages
        run: npm ci
        working-directory: web

      - name: Install Python packages
        run: uv sync --all-packages

      - name: Run all Python tests
        run: make py-test
