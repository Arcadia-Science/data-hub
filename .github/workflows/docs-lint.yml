name: Docs lint, typecheck, and link check

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/docs-lint.yml
      - docs/**
      - web/lib/docs.ts
      - web/lib/mcp/docs/docs-corpus.snapshot.json
      - web/content/changelog/**
      - web/microfrontends.json
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/docs-lint.yml
      - docs/**
      - web/lib/docs.ts
      - web/lib/mcp/docs/docs-corpus.snapshot.json
      - web/content/changelog/**
      - web/microfrontends.json
      - Makefile

jobs:
  docs-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install packages
        run: npm ci

      # `ultracite check` runs Biome's combined formatter + linter check
      # (read-only).
      - name: Lint and format check
        run: npm run lint:check

      # Also fails on bad MDX (frontmatter, unclosed components), because
      # `fumadocs-mdx` regenerates page types from `content/docs/`.
      - name: Type check
        run: npm run typecheck

      # Checks the docs links that cross folders: page names in
      # web/lib/docs.ts, `docs:` links in changelog entries, GitHub links from
      # the site to docs/developer, and relative links in docs/developer.
      - name: Check links
        run: npm run check:links

      # The MCP server answers questions from a bundled copy of these pages.
      # Regenerate it and fail if the committed copy differs.
      - name: Check docs bundle for the MCP server is current
        run: |
          npm run docs-corpus:generate
          bundle="../../web/lib/mcp/docs/docs-corpus.snapshot.json"
          if [ -n "$(git status --porcelain -- $bundle)" ]; then
            echo "::error::The docs bundle for the MCP server is out of date. Run 'make docs-catalogs' and commit the result."
            git --no-pager diff --stat -- $bundle
            exit 1
          fi
