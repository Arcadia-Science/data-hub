name: Lint, typecheck, and test Python packages

on:
  push:
    branches:
      - staging
      - production
    paths:
      - 'lambda/**'
      - 'watcher/**'
      - 'packages/shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/lint-and-typecheck-python.yml'
  pull_request:
    branches:
      - staging
      - production
    paths:
      - 'lambda/**'
      - 'watcher/**'
      - 'packages/shared/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/lint-and-typecheck-python.yml'

jobs:
  lint-typecheck-and-test-python-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: make py-lint

      - name: Type check
        run: make py-typecheck

      - name: Test
        run: make py-test
