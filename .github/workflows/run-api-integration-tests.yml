name: Run API integration tests

on:
  push:
    branches:
      - staging
      - production
  pull_request:
    branches:
      - staging
      - production

defaults:
  run:
    working-directory: web-app

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/data_hub_test
      AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      AUTH_GOOGLE_ID: stub
      AUTH_GOOGLE_SECRET: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install packages
        run: npm ci

      - name: Run API integration tests
        run: npm run test:integration
