name: Run unit and integration tests

on:
  push:
    branches:
      - staging
      - production
  pull_request:
    branches:
      - staging
      - production

jobs:
  python-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run Python unit tests
        run: make py-test-unit

  python-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/data_hub_test
      AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      AUTH_GOOGLE_ID: stub
      AUTH_GOOGLE_SECRET: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@v6

      - name: Install Node.js packages
        run: npm ci
        working-directory: web-app

      - name: Install Python packages
        run: uv sync --all-packages

      - name: Run Lambda integration tests
        run: make py-test-integration

  api-integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/data_hub_test
      AUTH_SECRET: ci-test-secret-at-least-32-characters-long!!
      AUTH_GOOGLE_ID: stub
      AUTH_GOOGLE_SECRET: stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install packages
        run: npm ci
        working-directory: web-app

      - name: Run API integration tests
        run: make fe-test-integration
