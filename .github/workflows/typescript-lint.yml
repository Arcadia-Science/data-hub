name: TypeScript lint and typecheck

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/typescript-lint.yml
      - web/**
      - docs/site/src/lib/mcp-catalog.snapshot.json
      - docs/site/src/lib/openapi.snapshot.json
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/typescript-lint.yml
      - web/**
      - docs/site/src/lib/mcp-catalog.snapshot.json
      - docs/site/src/lib/openapi.snapshot.json
      - Makefile

jobs:
  typescript-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install packages
        run: npm ci

      # `ultracite check` runs Biome's combined formatter + linter check
      # (read-only), replacing the separate Prettier `--check` + ESLint steps.
      - name: Lint and format check
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      # The docs site renders its API and MCP reference pages from committed
      # snapshots of these two documents. Regenerate them and fail if the
      # committed copies differ (or are missing).
      - name: Check docs API and MCP snapshots are current
        run: |
          npm run openapi:generate
          npm run mcp-catalog:generate
          snapshots="../docs/site/src/lib/openapi.snapshot.json ../docs/site/src/lib/mcp-catalog.snapshot.json"
          if [ -n "$(git status --porcelain -- $snapshots)" ]; then
            echo "::error::The docs API or MCP snapshot is out of date. Run 'make docs-catalogs' and commit the result."
            git --no-pager diff --stat -- $snapshots
            exit 1
          fi
