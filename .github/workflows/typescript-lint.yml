name: TypeScript lint and typecheck

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/typescript-lint.yml
      - web/**
      - docs/site/src/lib/mcp-catalog.snapshot.json
      - docs/site/src/lib/openapi.snapshot.json
      - Makefile
  pull_request:
    # `labeled` and `unlabeled` re-run the MCP compatibility check when the
    # `mcp-breaking-change` label is added or removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - staging
      - production
    paths:
      - .github/workflows/typescript-lint.yml
      - web/**
      - docs/site/src/lib/mcp-catalog.snapshot.json
      - docs/site/src/lib/openapi.snapshot.json
      - Makefile

jobs:
  typescript-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install packages
        run: npm ci

      # `ultracite check` runs Biome's combined formatter + linter check
      # (read-only), replacing the separate Prettier `--check` + ESLint steps.
      - name: Lint and format check
        run: npm run lint:check

      - name: Type check
        run: npm run typecheck

      # The docs site renders its API and MCP reference pages from committed
      # snapshots of these two documents. Regenerate them and fail if the
      # committed copies differ (or are missing).
      - name: Check docs API and MCP snapshots are current
        run: |
          npm run openapi:generate
          npm run mcp-catalog:generate
          snapshots="../docs/site/src/lib/openapi.snapshot.json ../docs/site/src/lib/mcp-catalog.snapshot.json"
          if [ -n "$(git status --porcelain -- $snapshots)" ]; then
            echo "::error::The docs API or MCP snapshot is out of date. Run 'make docs-catalogs' and commit the result."
            git --no-pager diff --stat -- $snapshots
            exit 1
          fi

      # An MCP client keeps the tool list it fetched when it connected, so a
      # removed or renamed tool, parameter, or field breaks it. Compare this
      # branch's catalog with the base branch's. The `mcp-breaking-change`
      # label skips the check, for a break whose 14-day deprecation window has
      # passed. The label also skips it on a release pull request into
      # `production`.
      - name: Check MCP tool schemas stay compatible
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'mcp-breaking-change')
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:docs/site/src/lib/mcp-catalog.snapshot.json > "$RUNNER_TEMP/base.json"
          npm run mcp-catalog:check-compat -- "$RUNNER_TEMP/base.json" ../docs/site/src/lib/mcp-catalog.snapshot.json
