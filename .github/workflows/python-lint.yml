name: Python lint and typecheck

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/python-lint.yml
      - lambda/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/python-lint.yml
      - lambda/**
      - packages/**
      - pyproject.toml
      - uv.lock
      - Makefile

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: make py-lint

      - name: Type check
        run: make py-typecheck
