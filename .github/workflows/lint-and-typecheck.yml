name: Lint and typecheck

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/lint-and-typecheck.yml
      - lambda/**
      - packages/**
      - web-app/**
      - pyproject.toml
      - uv.lock
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/lint-and-typecheck.yml
      - lambda/**
      - packages/**
      - web-app/**
      - pyproject.toml
      - uv.lock
      - Makefile

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint
        run: make py-lint

      - name: Type check
        run: make py-typecheck

  web-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install packages
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
