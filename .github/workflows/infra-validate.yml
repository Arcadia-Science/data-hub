name: Infra template validation

on:
  push:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/infra-validate.yml
      - .github/workflows/deploy-lambda.yml
      - .github/scripts/check_sam_deploy_overrides.py
      - infra/**
      - Makefile
  pull_request:
    branches:
      - staging
      - production
    paths:
      - .github/workflows/infra-validate.yml
      - .github/workflows/deploy-lambda.yml
      - .github/scripts/check_sam_deploy_overrides.py
      - infra/**
      - Makefile

jobs:
  infra-validate:
    runs-on: ubuntu-latest
    # `sam validate --lint` runs cfn-lint offline (no AWS credentials needed),
    # but the SAM CLI still wants a region to be resolvable.
    env:
      AWS_DEFAULT_REGION: us-west-1
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true
      - uses: astral-sh/setup-uv@v8.1.0

      - name: Validate CloudFormation templates
        run: make sam-validate

      # The script gives SAM dummy credentials and no reachable AWS endpoint.
      - name: Check sam deploy parameter overrides
        run: make sam-check-overrides
